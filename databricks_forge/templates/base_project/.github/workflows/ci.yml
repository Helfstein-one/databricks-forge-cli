name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check .
          ruff format --check .

  unit-and-performance-tests:
    name: PySpark Unit & Benchmark Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 11 (Required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit Tests (Chispa)
        run: |
          pytest tests/unit/ -v

      - name: Run Performance Benchmarks
        run: |
          pytest tests/performance/ -v --benchmark-columns=min,max,mean,stddev

  build-wheel:
    name: Build Wheel Package
    needs: [lint-and-format, unit-and-performance-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build Distribution Wheel
        run: |
          python -m build --wheel --outdir dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: {{project_slug}}-wheel
          path: dist/*.whl
