[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-forge-cli"
version = "0.3.0"
description = "Industrial-grade CLI for scaffolding, testing, packaging, and deploying PySpark Lakehouse projects to Databricks Community Edition & Databricks Connect."
readme = "README.md"
authors = [
    { name = "Mauricio Helfstein", email = "mauriciohelfstein@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "databricks",
    "pyspark",
    "delta-lake",
    "databricks-connect",
    "databricks-community-edition",
    "cli",
    "scaffolding",
    "lakehouse"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "requests>=2.31.0",
    "build>=1.0.0",
    "wheel>=0.40.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
]

[project.scripts]
forge = "databricks_forge.main:app"
databricks-forge = "databricks_forge.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["databricks_forge*"]

[tool.setuptools.package-data]
databricks_forge = ["templates/**/*", "templates/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
