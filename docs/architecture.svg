<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 780" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fb923c" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="725" y="45" text-anchor="middle" font-size="28" font-weight="800" fill="url(#gradHeader)" letter-spacing="0.5">
    DATABRICKS FORGE CLI — ARCHITECTURAL BLUEPRINT
  </text>
  <text x="725" y="75" text-anchor="middle" font-size="14" fill="#94a3b8">
    Hybrid Triad Execution: Local Docker / Delta Lake · Databricks Connect v2 · Remote CE Workspace API
  </text>

  <!-- ==================== COLUMN 1: LOCAL ENVIRONMENT ==================== -->
  <rect x="50" y="105" width="410" height="630" rx="16" fill="url(#cardBg1)" stroke="#1e3a8a" stroke-width="2" filter="url(#dropShadow)" />
  <rect x="50" y="105" width="410" height="42" rx="16" fill="#1e3a8a" />
  <rect x="50" y="130" width="410" height="17" fill="#1e3a8a" />
  <text x="75" y="132" font-size="15" font-weight="700" fill="#ffffff">1. LOCAL DEVELOPER WORKSTATION</text>

  <!-- Node: CLI -->
  <g transform="translate(75, 165)">
    <rect width="360" height="70" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="28" font-size="14" font-weight="700" fill="#60a5fa">⚡ Databricks Forge CLI</text>
    <text x="20" y="50" font-size="11" fill="#cbd5e1"><tspan fill="#38bdf8">forge init</tspan> · <tspan fill="#38bdf8">forge build</tspan> · <tspan fill="#38bdf8">forge deploy</tspan> · <tspan fill="#38bdf8">forge check</tspan></text>
  </g>

  <!-- Node: Scaffolding Structure -->
  <g transform="translate(75, 250)">
    <rect width="360" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="20" y="24" font-size="13" font-weight="700" fill="#f8fafc">📦 Scaffolded Lakehouse Architecture</text>
    <text x="20" y="46" font-size="11" fill="#94a3b8">• <tspan fill="#f1f5f9" font-weight="600">session.py</tspan>: SparkSession Factory (Local Delta vs Connect)</text>
    <text x="20" y="66" font-size="11" fill="#94a3b8">• <tspan fill="#f1f5f9" font-weight="600">catalog.py</tspan>: CatalogManager (Filesystem vs Metastore)</text>
    <text x="20" y="86" font-size="11" fill="#94a3b8">• <tspan fill="#f1f5f9" font-weight="600">pipelines/</tspan>: Medallion Architecture (Bronze/Silver/Gold)</text>
    <text x="20" y="104" font-size="11" fill="#94a3b8">• <tspan fill="#f1f5f9" font-weight="600">notebooks/</tspan>: CE Workspace Runner Notebook</text>
  </g>

  <!-- Node: Docker Dev -->
  <g transform="translate(75, 375)">
    <rect width="360" height="80" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <text x="20" y="24" font-size="13" font-weight="700" fill="#fbbf24">🐳 Docker Lakehouse Container</text>
    <text x="20" y="46" font-size="11" fill="#94a3b8">• Debian Bullseye + OpenJDK 11 + PySpark 3.5.0 + Delta 3.0</text>
    <text x="20" y="66" font-size="11" fill="#94a3b8">• Volume: <tspan fill="#fde68a">local_data_lake</tspan> for full local ACID transaction testing</text>
  </g>

  <!-- Node: Test Suite -->
  <g transform="translate(75, 470)">
    <rect width="360" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <text x="20" y="24" font-size="13" font-weight="700" fill="#34d399">🧪 Comprehensive Test Suite</text>
    <text x="20" y="46" font-size="11" fill="#94a3b8">• <tspan fill="#a7f3d0">Unit Tests</tspan>: Chispa (assert_df_equality schema &amp; data)</text>
    <text x="20" y="66" font-size="11" fill="#94a3b8">• <tspan fill="#a7f3d0">Integration &amp; Perf</tspan>: Catalog persistence &amp; pytest-benchmark</text>
  </g>

  <!-- Node: Remote Connect -->
  <g transform="translate(75, 565)">
    <rect width="360" height="70" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="20" y="24" font-size="13" font-weight="700" fill="#c084fc">🔌 Databricks Connect v2 Mode</text>
    <text x="20" y="48" font-size="11" fill="#94a3b8">EXECUTION_MODE=remote → Connects local IDE to CE cluster</text>
  </g>

  <!-- Node: Wheel -->
  <g transform="translate(75, 650)">
    <rect width="360" height="60" rx="10" fill="url(#orangeGlow)" filter="url(#dropShadow)" />
    <text x="180" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">📦 Compiled Wheel Binary</text>
    <text x="180" y="48" text-anchor="middle" font-size="11" fill="#ffedd5">dist/{{project_slug}}-0.1.0-py3-none-any.whl</text>
  </g>

  <!-- ==================== COLUMN 2: GITHUB ACTIONS ==================== -->
  <rect x="520" y="105" width="410" height="630" rx="16" fill="url(#cardBg1)" stroke="#065f46" stroke-width="2" filter="url(#dropShadow)" />
  <rect x="520" y="105" width="410" height="42" rx="16" fill="#065f46" />
  <rect x="520" y="130" width="410" height="17" fill="#065f46" />
  <text x="545" y="132" font-size="15" font-weight="700" fill="#ffffff">2. GITHUB ACTIONS CI/CD ESTEIRA</text>

  <!-- CI Pipeline -->
  <g transform="translate(545, 170)">
    <rect width="360" height="170" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="26" font-size="14" font-weight="700" fill="#34d399">⚙️ CI Pipeline (.github/workflows/ci.yml)</text>
    <text x="20" y="52" font-size="11" fill="#94a3b8">1. <tspan fill="#f1f5f9">Lint &amp; Formatting</tspan>: Ruff check &amp; format check</text>
    <text x="20" y="74" font-size="11" fill="#94a3b8">2. <tspan fill="#f1f5f9">PySpark Setup</tspan>: OpenJDK 11 + Python 3.11</text>
    <text x="20" y="96" font-size="11" fill="#94a3b8">3. <tspan fill="#f1f5f9">Chispa Assertions</tspan>: DataFrame transformation tests</text>
    <text x="20" y="118" font-size="11" fill="#94a3b8">4. <tspan fill="#f1f5f9">Performance Benchmarks</tspan>: Volumetry thresholds</text>
    <text x="20" y="140" font-size="11" fill="#94a3b8">5. <tspan fill="#f1f5f9">Wheel Packaging</tspan>: build --wheel &amp; artifact upload</text>
  </g>

  <!-- Trigger Node -->
  <g transform="translate(625, 375)">
    <rect width="200" height="50" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.2" />
    <text x="100" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#f8fafc">Push to 'main'</text>
    <text x="100" y="40" text-anchor="middle" font-size="10" fill="#94a3b8">Merge Approval</text>
  </g>

  <!-- CD Pipeline -->
  <g transform="translate(545, 455)">
    <rect width="360" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="26" font-size="14" font-weight="700" fill="#60a5fa">🚀 CD Pipeline (.github/workflows/cd.yml)</text>
    <text x="20" y="52" font-size="11" fill="#94a3b8">• GitHub Secrets Injected:</text>
    <text x="35" y="72" font-size="11" fill="#93c5fd">DATABRICKS_HOST, DATABRICKS_TOKEN</text>
    <text x="20" y="96" font-size="11" fill="#94a3b8">• Automated Execution: <tspan fill="#60a5fa" font-weight="600">forge deploy</tspan></text>
    <text x="20" y="118" font-size="11" fill="#94a3b8">• Compiles .whl and imports to Workspace API</text>
    <text x="20" y="140" font-size="11" fill="#94a3b8">• Syncs runner notebook with parameter widgets</text>
    <text x="20" y="162" font-size="11" fill="#34d399">✔ Zero downtime artifact versioning</text>
  </g>

  <!-- ==================== COLUMN 3: DATABRICKS CE ==================== -->
  <rect x="990" y="105" width="410" height="630" rx="16" fill="url(#cardBg1)" stroke="#b91c1c" stroke-width="2" filter="url(#dropShadow)" />
  <rect x="990" y="105" width="410" height="42" rx="16" fill="#991b1b" />
  <rect x="990" y="130" width="410" height="17" fill="#991b1b" />
  <text x="1015" y="132" font-size="15" font-weight="700" fill="#ffffff">3. DATABRICKS COMMUNITY EDITION (CE)</text>

  <!-- Workspace REST API -->
  <g transform="translate(1015, 170)">
    <rect width="360" height="75" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <text x="20" y="26" font-size="13" font-weight="700" fill="#f87171">🌐 Workspace REST API v2.0</text>
    <text x="20" y="48" font-size="11" fill="#fca5a5">POST /api/2.0/workspace/import</text>
    <text x="20" y="65" font-size="10" fill="#94a3b8">Bypasses CE lack of Jobs API v2.1 via direct Workspace import</text>
  </g>

  <!-- Workspace Folder Structure -->
  <g transform="translate(1015, 260)">
    <rect width="360" height="85" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <text x="20" y="24" font-size="12" font-weight="700" fill="#fbbf24">📂 /Shared/forge_deployments/{{project_slug}}</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">├── {{project_slug}}-0.1.0-py3-none-any.whl</text>
    <text x="20" y="66" font-size="11" fill="#cbd5e1">└── run_pipeline_notebook (Workspace Notebook)</text>
  </g>

  <!-- CE Runner Notebook -->
  <g transform="translate(1015, 360)">
    <rect width="360" height="185" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="20" y="26" font-size="13" font-weight="700" fill="#f472b6">📓 CE Runner Notebook (run_pipeline_notebook)</text>
    <text x="20" y="50" font-size="11" fill="#94a3b8">1. <tspan fill="#f9a8d4">Widgets</tspan>: row_count, log_level, mode</text>
    <text x="20" y="72" font-size="11" fill="#94a3b8">2. <tspan fill="#f9a8d4">Auto Install</tspan>: %pip install {{project_slug}}.whl</text>
    <text x="20" y="94" font-size="11" fill="#94a3b8">3. <tspan fill="#f9a8d4">CatalogManager</tspan>: Reads/Writes Delta tables</text>
    <text x="20" y="116" font-size="11" fill="#94a3b8">4. <tspan fill="#f9a8d4">Pipeline Run</tspan>: Bronze → Silver → Gold metrics</text>
    <text x="20" y="138" font-size="11" fill="#94a3b8">5. <tspan fill="#f9a8d4">Visual Analytics</tspan>: display(gold_df)</text>
    <text x="20" y="160" font-size="11" fill="#34d399">✔ Automated assertions &amp; summary logs</text>
  </g>

  <!-- CE Cluster -->
  <g transform="translate(1015, 560)">
    <rect width="360" height="65" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.2" />
    <text x="20" y="26" font-size="12" font-weight="700" fill="#f8fafc">💻 Databricks CE Compute Cluster</text>
    <text x="20" y="46" font-size="11" fill="#94a3b8">Single-Node · Spark 3.5.x · Delta Lake 3.x · Python 3.11</text>
  </g>

  <!-- Delta Storage -->
  <g transform="translate(1015, 640)">
    <rect width="360" height="70" rx="10" fill="url(#blueGlow)" filter="url(#dropShadow)" />
    <text x="180" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">🗄️ Databricks Metastore / Delta Tables</text>
    <text x="180" y="50" text-anchor="middle" font-size="11" fill="#bfdbfe">default.{{project_slug}}_bronze / _silver / _gold</text>
  </g>

  <!-- CONNECTORS -->
  <!-- Col 1 to Col 2 -->
  <path d="M 435 200 L 540 200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="487" y="190" text-anchor="middle" font-size="10" font-weight="600" fill="#93c5fd">git push</text>

  <!-- CI to Merge -->
  <path d="M 725 340 L 725 370" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Merge to CD -->
  <path d="M 725 425 L 725 450" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- CD to Databricks API -->
  <path d="M 905 545 L 960 545 L 960 210 L 1010 210" stroke="#fb923c" stroke-width="2" fill="none" marker-end="url(#arrowOrange)" />
  <text x="960" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#fdba74" transform="rotate(-90 960 380)">forge deploy</text>

  <!-- Databricks internal links -->
  <path d="M 1195 245 L 1195 255" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M 1195 345 L 1195 355" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M 1195 545 L 1195 555" stroke="#ec4899" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M 1195 625 L 1195 635" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)" />

</svg>
